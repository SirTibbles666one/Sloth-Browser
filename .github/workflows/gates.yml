name: gates

# The three gates this project ships behind: the reflective-name audit, the shell
# harness, and the ship gate. The ship gate needs a built APK and the base APK, which
# is not in this repository, so it runs where a build runs. These two run on every push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  harness:
    name: shell harness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already carries the SDK; setup-android failed here, and a step that
      # installs what is already present is one more thing that can break for no reason.
      - name: Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" 

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('tests/**/*.gradle', 'tests/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Robolectric downloads its android-all jars on first use; keep them between runs.
      - name: Robolectric cache
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: robolectric-${{ runner.os }}-${{ hashFiles('tests/build.gradle') }}
          restore-keys: robolectric-${{ runner.os }}-

      - name: Harness
        working-directory: tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      # A Gradle test task with no tests to run is SUCCESS, and the artifact step below ignores a
      # missing report, so a moved source set used to be a green build. This is that incident,
      # closed: the count has to be there and has to be at least what the harness contains.
      - name: Test floor
        working-directory: tests
        run: |
          python3 - <<'PY'
          import glob, re, sys
          floor = int(open("min-tests.txt").read().strip())
          total = 0
          for path in glob.glob("build/test-results/testDebugUnitTest/*.xml"):
              head = open(path).read(400)
              m = re.search(r'tests="(\d+)"', head)
              if m:
                  total += int(m.group(1))
          print(f"{total} tests ran, floor is {floor}")
          sys.exit(0 if total >= floor else 1)
          PY

      - name: Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-report
          path: tests/build/reports/tests/testDebugUnitTest
          if-no-files-found: error

  names:
    name: reflective names
    # Needs the base APK, which is the app's own build and is not redistributable. Without
    # it the job is skipped outright rather than reporting a green run of nothing.
    if: vars.BASE_APK_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: shell_refs
        run: |
          curl -sSL -o base.apk "${{ vars.BASE_APK_URL }}"
          python3 audit/shell_refs.py base.apk src
